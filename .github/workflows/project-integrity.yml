name: Project integrity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checker dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Run project integrity checks
        run: python tools/check_project.py
      - name: Run integrity regression tests
        run: python -B -m unittest discover -s tools -p "test_*.py" -v
